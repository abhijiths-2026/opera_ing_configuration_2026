    - NO_SHOW_ROOMS
    expected_always_null_fields: []
    extra_fields_disposition: PASS_WITH_STRUCTURE_CHANGE
    missing_required_field_disposition: FAIL
    unique_key_fields:
    - CONSIDERED_DATE
    min_rows: 1
  PM:
    note: PM field contract is expressed via common_field_definitions + layout additional_field_definitions
