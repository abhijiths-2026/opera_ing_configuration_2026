configuration_id: OPERA_ING_LM_PM
configuration_version: '1.6'
active_configuration_file: opera_ing_configuration_v1.6.yaml
configuration_alias_file: opera_ing_configuration.yaml
version_rationale: 1.6 Opera-ING Phase 0 config-driven contract covering Location Metrics (LM) and Product
  Metrics (PM) XML. Aligned to project governance (fingerprint policy, disposition vocabulary, discovery
  isolation, artifact pins, observe_only, fail-open Bronze / fail-closed canonical). Seeded for onboarding
  property Sheraton Asuncion (ASUSI) under s3://ing-marriott-useast-prod/OPERA/raw_data/ASUSI/. LM adapted
  from LM_config.json; PM layouts/roles adapted from PM_opera_ing_configuration.yaml (prior Phase 1 draft).
  Layout selection is by structural signature only — never by property code.
configuration_status: DRAFT
status_lifecycle:
- DRAFT
- APPROVED
- ACTIVE
- SUPERSEDED
- RETIRED
phase: phase_0_validation
description: Opera 5.5 on-premises LM + PM XML extracts for the Opera-ING ETL — Phase 0 observe-only structural
  governance. Batch expectation is LM + PM per property per business date. Engine must not embed property-specific
  business rules; all contract rules live in this configuration.
vendor: Opera
pms_version: 5.5_on_prem
report_family: OPERA_ING
etl: Opera-ING
format: xml
encoding: UTF-8
role_vocabulary_version: '1.0'
artifact_pins:
  corpus_index:
    path: sources/opera_ing/Opera_ING_Corpus_Index_v1.6.json
    version: '1.0'
    role: Fingerprint registry for LM and PM structural variants. Absent at v1.6 — layouts[] is the interim
      registry.
    mutate: false
    status: pending
  validation_report_spec:
    path: sources/opera_ing/Opera_ING_Phase0_Validation_Report_Spec_v1.6.md
    version: '1.0'
    role: Human brief including discovery isolation + growth counters.
    mutate: false
    status: pending
  validation_report_output:
    json: reports/opera_ing/validation_report_v1.6.json
    md: reports/opera_ing/validation_report_v1.6.md
    report_version: '1.0'
  corpus_path: examples/opera_ing_v1.6/corpus/
  rule_catalogue:
    path: sources/opera_ing/Opera_ING_Phase0_Rule_Catalogue_v1.6.json
    version: '1.0'
    role: Machine-readable rule IDs, thresholds, dispositions. Authoritative for validators. Spec prose
      is human brief only.
    mutate: false
    status: pending
  authoritative_config_format: yaml
  generated_formats:
  - json
  format_sync:
    authoritative: opera_ing_configuration_v1.6.yaml
    generated:
    - opera_ing_configuration_v1.6.json
    - opera_ing_configuration.yaml
    - opera_ing_configuration.json
    note: Loader must read YAML (or JSON generated from it). Never hand-edit JSON or alias files.
  discovery_results_output:
    json: reports/opera_ing/discovery_results_v1.6.json
    discovery_version: '1.0'
    isolation_rule: never_write_discovered_settings_into_configuration
  interim_fingerprint_registry:
    path: opera_ing_configuration_v1.6.yaml#layouts
    role: Approved structural fingerprints for the Phase0 engine until the corpus index is pinned and
      loaded.
    layout_count: 3
    mutate: false
    discovery_isolation: Auto-discovered settings must go to discovery_results only; promoting a fingerprint
      into layouts[] requires an explicit configuration change.
  seed_corpus:
    property_name: Sheraton Asuncion
    property_code: ASUSI
    aws_account: fpg-proj-ing-prod
    bucket: s3://ing-marriott-useast-prod/OPERA/raw_data/ASUSI/
    etl: Opera-ING
    note: Seed identifies the first property used to exercise this pack. It must never drive layout selection
      or hardcode property rules in the engine.
concurrency_note: Multiple layouts for the same report type may hold ACTIVE simultaneously. SUPERSEDED
  applies only when a layout is replaced for every property that used it. base_34_field and extended_38_field
  are concurrent PM structural variants, not sequential versions. Selection is by structural signature
  only — never by property code, never by closest field-count.
run_mode: observe_only
observe_only_constraints:
- no_canonical_writes
- no_registry_mutation
- no_index_mutation
- no_binding_created_by_classifier
- dispositions_must_cite_rule_id_and_evidence
- no_discovered_settings_written_to_configuration
- discovery_counters_required_every_run
- no_property_specific_rules_in_engine
propagation_rule:
  principle: Fail-open for Bronze capture, fail-closed for canonical propagation.
  declared_fields: Propagate to canonical mapping only when Phase advances beyond observe_only and role
    classification is canonical.
  undeclared_fields: Bronze only. Never canonical.
  pii_deny_fields: Bronze only. Never canonical. Values redacted in reports (hash/shape only).
  unbound_slot_default:
    disposition: PASS_WITH_STRUCTURE_CHANGE
    canonical: blocked
    principle: deny_by_default
  rationale: Newly appearing XML nodes cannot be assessed against the PII deny-list. Non-propagation makes
    leakage structurally impossible.
fingerprint_policy:
  source: artifact_pins.corpus_index
  interim_registry: layouts
  order_sensitive: false
  presence_based: true
  algorithm: sha256_utf8_join_0x1f
  computed_over: root_node + record_node + sorted list of declared node names observed present in the
    file (presence, not population)
  match_rule: Exact structural signature match against a layout.structure_signature scoped by report_type.
    Never select by property code. Never select the closest layout.
  rejected_heuristics:
  - property code
  - closest field-count match
  - set-equality without declared root/record context
  - hardcoded per-property business rules in the engine
  property_onboarding:
    binding_base_properties: 0
    assessment: seed_only
    seed_property: ASUSI
    expected_fingerprint_miss: An unknown signature on a newly onboarded property is the designed fail-closed
      / structure-change outcome, not an operational defect. Do not loosen matching; add an approved layout
      via configuration change.
    unknown_fingerprint_disposition: PASS_WITH_STRUCTURE_CHANGE
    clears_when: registry entry for the observed structural signature
reports:
  expected_types:
  - LM
  - PM
  required_file: true
  missing_file_disposition: FAIL
  batch:
    required_report_types:
    - LM
    - PM
    incomplete_batch_behavior: FAIL
    note: Two files expected per property per business date (LM_<PROP>_<MMDDYYYY>.xml and PM_<PROP>_<MMDDYYYY>.xml).
  grains:
    LM:
    - CONSIDERED_DATE
    PM:
    - property_code
    - business_date
    - charge_code
  business_date:
    LM:
      filename_token_format: MMDDYYYY
      content_field: CONSIDERED_DATE
      content_format: DD-MMM-YY
    PM:
      filename_token_format: MMDDYYYY
      content_field: C12
      content_format: DD-MMM-YY
filename:
  LM:
    pattern: ^LM_(?P<property_id>[A-Z0-9]+)_(?P<business_date>[0-9]{8})\.xml$
    date_format_in_filename: MMDDYYYY
    property_id_source: filename
    business_date_source: filename
  PM:
    pattern: ^PM_(?P<property_id>[A-Z0-9]+)_(?P<business_date>[0-9]{8})\.xml$
    date_format_in_filename: MMDDYYYY
    property_id_source: filename
    business_date_source: filename
  s3_path_pattern: OPERA/raw_data/{property_id}/{LM|PM}_{property_id}_{MMDDYYYY}.xml
  note: Identity tokens come from the filename (and path segment). Layout selection never uses property_id.
structure_by_report_type:
  LM:
    root_node: HISTORY_FORECAST
    record_node: G_CONSIDERED_DATE
    record_path: HISTORY_FORECAST/LIST_G_GPAGEID/G_GPAGEID/LIST_G_REC_TYPE/G_REC_TYPE/LIST_G_CONSIDERED_DATE/G_CONSIDERED_DATE
    required_paths:
    - LIST_G_GPAGEID
    - LIST_G_GPAGEID/G_GPAGEID
    - LIST_G_GPAGEID/G_GPAGEID/LIST_G_REC_TYPE
    - LIST_G_GPAGEID/G_GPAGEID/LIST_G_REC_TYPE/G_REC_TYPE
    - LIST_G_GPAGEID/G_GPAGEID/LIST_G_REC_TYPE/G_REC_TYPE/LIST_G_CONSIDERED_DATE
    - LIST_G_GPAGEID/G_GPAGEID/LIST_G_REC_TYPE/G_REC_TYPE/LIST_G_CONSIDERED_DATE/G_CONSIDERED_DATE
    required_nodes_strict: true
  PM:
    root_node: OSR_LANDSCAPE
    record_node: G_C9
    record_path: OSR_LANDSCAPE/LIST_G_C9/G_C9
    ignored_nodes:
    - LIST_G_A
    - G_A
    - A
    - CF_LOGO
    - CF_1
    ignored_nodes_complete: true
structure_signature:
  algorithm: sha256_utf8_join_0x1f
  presence_not_population: A node present but empty participates in the signature. Value population is
    evaluated separately in field validation.
  selection_rule: Exact match against a layout.structure_signature for the resolved report_type only.
    Never select by property code. Never select the closest layout.
  unknown_signature_outcome: PASS_WITH_STRUCTURE_CHANGE when required identity/canonical roles remain
    resolvable; otherwise FAIL.
  undeclared_nodes_alter_signature: true
pii_rules:
  deny_list:
  - C114
  note: Global known-PII deny list. Always applied before propagation, including when no exact layout
    is selected. Layout pii_rules.deny_list may add fields but must not remove or override global rules.
    Blocked fields are reported with reason code known_pii.
  reason_code: known_pii
sensitive_detection:
  masked_payment_card_number:
    pattern: ^X{4,}\d{4}$
    description: Masked payment-card PAN remnant (e.g. XXXXXXXXXXXX7962).
    action: quarantine_or_redact
canonical_roles:
  vocabulary:
  - arrival_date
  - business_date
  - charge_amount
  - charge_code
  - charge_description
  - departure_date
  - external_reference
  - property_code
  - quantity
  - reason_code
  - reservation_reference
  required_for_safe_resolution:
    LM:
    - business_date
    PM:
    - business_date
    - property_code
    - charge_code
  assignments_shared_across_layouts:
    LM:
      business_date: CONSIDERED_DATE
    PM:
      business_date: C12
      charge_code: C42
      charge_description: C45
      property_code: C51
      external_reference: C93
      quantity: C102
      reason_code: C108
  required_for_unknown_structure:
    LM:
    - business_date
    PM:
    - business_date
    - property_code
    - charge_code
  candidates:
    charge_amount: C48
    net_or_pre_tax_amount: C33
    reservation_reference: C9
    arrival_date: C15
    departure_date: C18
  note: 'Phase 0 observe_only: candidate roles are evidence-only and must not activate canonical propagation.
    charge_amount remains unassigned (C48 is the leading candidate) until a reviewed promotion.'
identity:
  roles:
  - property_code
  - business_date
  filename_token_patterns:
    property_code: ^[A-Z0-9]+$
    business_date: ^[0-9]{8}$
  note: Filename identity patterns are configuration constants for this source. The engine applies whatever
    patterns are declared here; it does not embed source-specific catalogues or property allow-lists.
