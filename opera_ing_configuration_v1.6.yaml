known_residual_risk:
  id: ORDINAL_SHIFT_ROLE_DRIFT
  description: Oracle Reports names data-model columns by ordinal position in the report SELECT. A column
    inserted mid-SELECT shifts every subsequent C-number. The change presents as additive (nodes added,
    none removed, all declared nodes still present) while a structural role silently points at a different
    column.
  detectable_by:
  - Datatype assertion failure where the new column has a different type
  - Format assertion failure
  - Structure-change report showing additional nodes
  not_detectable_by: Any automated check, where the displaced column has the same datatype and format.
    A decimal replaced by a different decimal will pass every validation in this configuration.
  mitigation: Structure-change reports must be actioned rather than filed. The ageing schedule exists
    for this reason.
  upstream_cure: Mandate aliased columns in the Opera report build standard (SELECT x AS AGENT_ID) so
    elements carry semantic names and ordinal position becomes irrelevant.
