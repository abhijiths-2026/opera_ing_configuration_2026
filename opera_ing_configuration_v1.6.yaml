validation:
  spec: artifact_pins.validation_report_spec
  disposition_states:
  - PASS
  - PASS_WITH_QUARANTINE
  - PASS_WITH_STRUCTURE_CHANGE
  - DEGRADED
  - FAIL
  rule_families:
  - OPERA-ING-PHY
  - OPERA-ING-FN
  - OPERA-ING-STR
  - OPERA-ING-ROW
  - OPERA-ING-VAL
  - OPERA-ING-ID
  rule_catalogue: artifact_pins.rule_catalogue
  rule_authority: rule_catalogue
  row_quarantine_triggers:
  - A field with presence:required is absent
  - A field with presence:required and value_required:true is null or blank
  - A value fails its declared datatype format assertion
  - The row does not contain the required structural element set
  - A required structural role cannot be resolved for the row
  row_quarantine_non_triggers:
  - A charge code has not been seen before
  - A charge code differs from another property's
  - A charge description is property-specific
  - No business classification has been assigned
  - An undeclared node is present
  - A field with value_required:false is empty
  - A field with presence:expected is absent
  fail_conditions:
  - File missing or empty
  - Malformed XML
  - Root node is not OSR_LANDSCAPE
  - Record node G_C9 absent
  - Zero records
  - Property cannot be resolved
  - Report type cannot be resolved
  - Business date cannot be resolved
  - Identity conflict between filename, path and content
  - Duplicate file hash
  - A required structural role cannot be resolved for the file
  - No valid rows remain
  - LM root node is not HISTORY_FORECAST
  - LM record node G_CONSIDERED_DATE absent
  - Incomplete LM+PM batch for a business date
  outcomes:
    PASS: File and all rows passed. Structure matches the approved configuration.
    PASS_WITH_QUARANTINE: File processed. Some rows quarantined.
    PASS_WITH_STRUCTURE_CHANGE: File processed successfully. Structure does not exactly match any approved
      layout signature, but required canonical roles were safely resolved. Undeclared and deny-listed
      fields were captured in Bronze and not propagated. Engineering review required.
    FAIL: Unsafe to process. Includes hard fail conditions, or an unknown structure where required canonical
      roles cannot be safely resolved.
    DEGRADED: File processed with recoverable operational issues (resolvable non-standard filename, missing
      optional field, metadata warning).
  duplicate_rules:
    LM:
      file_hash_duplicate_behavior: FAIL
      unique_key_fields:
      - CONSIDERED_DATE
      duplicate_key_severity: FAIL
      duplicate_threshold_percent: 0
    PM:
      file_hash_duplicate_behavior: FAIL
      row_duplicate_behavior: INFORMATIONAL
      note: No column in the PM extract is unique per row. Exact duplicate rows occur legitimately (repeat
        postings) at 1-67% across observed files. Duplicate counts are reported only and never degrade
        or fail the file. Deferred pending the canonical transaction-identity strategy.
