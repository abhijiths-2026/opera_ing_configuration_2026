candidate_confidence:
  method: deterministic_weighted_coverage
  weights:
    property_coverage: 0.25
    file_coverage: 0.15
    layout_coverage: 0.15
    datatype_pass_rate: 0.25
    population_consistency: 0.1
    conflict_penalty: 0.1
  conflict_penalty_formula: 1 / (1 + semantic_conflicts)
  recommendation_rule: Always DO_NOT_PROMOTE when mapping_governance.promotion.automatic is false. Phase 1 score
    measures evidence strength only; governance forces DO_NOT_PROMOTE. Later recommendation values may distinguish
    INSUFFICIENT_EVIDENCE, CONFLICT_REQUIRES_REVIEW, and ELIGIBLE_FOR_HUMAN_REVIEW without enabling automatic
    promotion. Promotion still requires a reviewed configuration change.
  note: confidence_score = sum(weight_i * metric_i). No LLM or subjective scoring. semantic_conflicts reduce the
    conflict_penalty term.
