    datatype: string
    suppressible: false
    pii_policy: allow
    participates_in_signature: true
    note: Empty in 100% of observed rows.
    classification: unused
    evidence_status: structurally_present_typically_empty
    validation_phase: phase_0_structure
  - field: C120
    structural_role: null
    presence: expected
    value_required: false
    datatype: string
    suppressible: false
    pii_policy: allow
    participates_in_signature: true
    note: Y/N flag.
    classification: informational
    evidence_status: discovery_pending
    validation_phase: phase_1
  pii_rules:
    deny_list: []
    extends_global: true
    note: Effective deny list = global pii_rules.deny_list ∪ this list. C114 is classified globally as known PII
      and remains blocked even when this layout is not selected.
structure_change_report:
  emitted_when: Received signature does not match the approved signature
  contents:
  - configuration_id
  - configuration_version
  - approved_signature
  - received_signature
  - expected_node_set
  - additional_nodes_detected
  - missing_nodes_detected
  - suppressible_nodes_absent
  - all_required_roles_resolved
  - propagation_decision_per_undeclared_node
  - rows_processed
  - rows_quarantined
  - recommended_engineering_action
  alerting: Deduplicated by received_signature. The first occurrence of a signature raises one engineering work
    item. Further occurrences are suppressed until the configuration is updated or the signature changes again.
    Alerting is never per-file.
  ageing:
  - day: 0
    action: Work item created
  - day: 7
    action: Reminder
  - day: 14
    action: Raised to high priority
  - day: 30
    action: Architecture escalation
  ageing_note: Ageing affects governance only. Ingestion continues unaffected at every stage.
