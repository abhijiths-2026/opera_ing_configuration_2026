    suppressible: false
    pii_policy: deny
    participates_in_signature: true
    note: FREE-TEXT GUEST NOTES. Populated in 100% of rows, up to 494 chars. Contains guest names, room numbers
      and commercial negotiations. Must never propagate.
    classification: prohibited
    evidence_status: policy_confirmed
    validation_phase: phase_0_structure
  - field: C117
    structural_role: null
