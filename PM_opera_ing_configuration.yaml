validation_rules:
  row_quarantine_triggers:
  - A field with presence:required is absent
  - A field with presence:required and value_required:true is null or blank
  - A value fails its declared datatype format assertion
  - The row does not contain the required structural element set
  - A required structural role cannot be resolved for the row
  row_quarantine_non_triggers:
  - A charge code has not been seen before
  - A charge code differs from another property's
  - A charge description is property-specific
  - No business classification has been assigned
  - An undeclared node is present
  - A field with value_required:false is empty
  - A field with presence:expected is absent
  duplicate_rules:
    file_hash_duplicate_behavior: FAIL
    row_duplicate_behavior: INFORMATIONAL
    note: No column in the PM extract is unique per row. Exact duplicate rows occur legitimately (repeat postings)
      at 1-67% across observed files. Duplicate counts are reported only and never degrade or fail the file. Deferred
      pending the canonical transaction-identity strategy.
  fail_conditions:
  - File missing or empty
  - Malformed XML
  - Root node is not OSR_LANDSCAPE
  - Record node G_C9 absent
  - Zero records
  - Property cannot be resolved
  - Report type cannot be resolved
  - Business date cannot be resolved
  - Identity conflict between filename, path and content
  - Duplicate file hash
  - A required structural role cannot be resolved for the file
  - No valid rows remain
  outcomes:
    PASS: File and all rows passed. Structure matches the approved configuration.
    PASS_WITH_QUARANTINE: File processed. Some rows quarantined.
    PASS_WITH_STRUCTURE_CHANGE: File processed successfully. Structure does not exactly match any approved layout
      signature, but required canonical roles were safely resolved. Undeclared and deny-listed fields were captured
      in Bronze and not propagated. Engineering review required.
    FAIL: Unsafe to process. Includes hard fail conditions, or an unknown structure where required canonical roles
      cannot be safely resolved.
    DEGRADED: File processed with recoverable operational issues (resolvable non-standard filename, missing optional
      field, metadata warning).
  presence_semantics:
    required: Absence fails identity/role/privacy/downstream safety checks for the file or row.
    expected: Known field that normally appears. Absence changes the structural signature and is handled as PASS_WITH_STRUCTURE_CHANGE
      when required roles remain resolvable; it does not quarantine all rows.
  blocking_reason_codes:
  - known_pii
  - undeclared_field
  - invalid_value
  - identity_conflict
  - required_role_unresolved
  - malformed_structure
  - sensitive_pattern
  blocking_reason_severity:
  - malformed_structure
  - identity_conflict
  - required_role_unresolved
  - known_pii
  - sensitive_pattern
  - undeclared_field
  - invalid_value
  report:
    json_suffix: .validation-report.json
    summary_suffix: .validation-summary.txt
    fields:
    - file_name
    - property_code
    - business_date
    - processing_timestamp
    - configuration_file
    - configuration_version
    - selected_layout
    - signature_received
    - signature_matched
    - result
    - rows_received
    - rows_valid
    - rows_quarantined
    - rows_propagated
    - root_node
    - record_node
    - canonical_roles_resolved
    - canonical_roles_unresolved
    - added_nodes
    - missing_nodes
    - undeclared_nodes
    - known_pii_fields_detected
    - blocked_from_propagation
    - blocking_reasons
    - row_validation_failures
    - identity_failures
    - quarantine_location
    - processing_duration_ms
    - configuration_checksum
    - validation_decision
    metrics_note: All counts and values are calculated from the file being processed. Corpus observation totals
      are not runtime constants.
