configuration_id: OPERA55_PM
configuration_version: '1.11'
active_configuration_file: PM_opera_ing_configuration_v1.11.yaml
configuration_alias_file: PM_opera_ing_configuration.yaml
version_rationale: Filename versioning starts at 1.11 for Phase 1 corpus-discovery (unknown-signature
  propagation controls, candidate evidence, corpus summaries, and property scorecards). The prior branch tip
  used configuration_version 1.3.0; jumping to 1.11 is intentional to begin explicit file-version naming, not
  a skipped sequence of intermediate releases. Future edits must bump the filename and configuration_version
  together (for example 1.12) and keep the unversioned alias identical to the active versioned file.
configuration_status: DRAFT
status_lifecycle:
- DRAFT
- APPROVED
- ACTIVE
- SUPERSEDED
- RETIRED
concurrency_note: Multiple layouts for the same vendor/report may hold ACTIVE simultaneously. SUPERSEDED applies
  only when a layout is replaced for every property that used it. base_34_field and extended_38_field are concurrent
  structural variants, not sequential versions. Layout selection is by structural signature only, never by property
  code.
activation_blocked_by:
- role: charge_amount
  reason: Required structural role 'charge_amount' is not assigned to any field (candidate C48 pending corpus validation).
  blocks_ingestion: false
  blocks_bronze_capture: false
  blocks_structural_validation: false
  blocks_layout_selection: false
  blocks_canonical_role_activation: true
  blocks_canonical_propagation_of_role: true
  allows_candidate_evidence_collection: true
description: 'Opera 5.5 on-premises Product Metrics. Phase 1 corpus-discovery configuration: structural validation,
  candidate evidence collection, and property scorecards across multi-property XML corpora. Candidate roles are
  not promoted automatically.'
vendor: Opera
pms_version: 5.5_on_prem
report_type: PM
format: xml
role_vocabulary_version: '1.0'
structure:
  root_node: OSR_LANDSCAPE
  record_node: G_C9
  record_path: OSR_LANDSCAPE/LIST_G_C9/G_C9
  ignored_nodes:
  - LIST_G_A
  - G_A
  - A
  - CF_LOGO
  - CF_1
  ignored_nodes_complete: true
structure_signature:
  algorithm: sha256
  computed_over:
  - root_node
  - record_node
  - sorted list of declared node names observed present in the file
  presence_not_population: A node present but empty participates in the signature. Value population is evaluated
    separately in field validation.
  suppressible_handling: A node declared suppressible:true may be absent without altering the signature. No node
    in this configuration is currently suppressible.
  undeclared_nodes_alter_signature: true
  signature_mismatch_policy: An unknown signature never silently selects the closest layout. It yields PASS_WITH_STRUCTURE_CHANGE
    only when required canonical roles can still be safely resolved; otherwise FAIL.
  selection_rule: Exact match against a layout.structure_signature only. Never select by property code. Never select
    the closest layout.
  unknown_signature_outcome: PASS_WITH_STRUCTURE_CHANGE when all roles in required_for_unknown_structure can be
    resolved from known fields that remain present; otherwise FAIL. Closest known structure is compared for reporting
    only and is never selected.
propagation_rule:
  principle: Fail-open for processing, fail-closed for propagation.
  declared_fields: Propagate to canonical mapping.
  undeclared_fields: Captured in Bronze and reported. NEVER propagated to canonical.
  pii_deny_fields: Captured in Bronze. NEVER propagated to canonical. Redacted in quarantine evidence and in the
    validation report; only the field name and a redaction marker are recorded, never the value.
  rationale: A newly appearing node cannot be assessed against the PII deny-list because the deny-list only covers
    known fields. Non-propagation makes leakage structurally impossible rather than dependent on a check.
pii_rules:
  deny_list:
  - C114
  note: Global known-PII deny list. Always applied before propagation, including when no exact layout is selected.
    Layout pii_rules.deny_list may add fields but must not remove or override global rules. Blocked fields are reported
    with reason code known_pii.
  reason_code: known_pii
sensitive_detection:
  masked_payment_card_number:
    pattern: ^X{4,}\d{4}$
    description: Masked payment-card PAN remnant (e.g. XXXXXXXXXXXX7962).
    action: quarantine_or_redact
mapping_governance:
  principle: discover first, prove second, promote last
  phase: phase_1_corpus_validation
  classifications:
  - canonical
  - candidate
  - informational
  - unused
  - sensitive
  - prohibited
  promotion_criteria:
  - consistent semantic meaning across observed files
  - stable across supported layouts
  - stable across Opera versions in the corpus
  - reconciles with expected business behaviour
  - no conflicting evidence observed
  promotion_rule: A candidate becomes canonical only after successful validation across the full XML corpus. Representative
    samples generate hypotheses only; they are not proof.
  sample_files_policy: Supplied XML samples are representative only. They may seed candidate mappings and validation
    hypotheses, never permanent canonical assignments.
  promotion:
    automatic: false
    requires_human_review: true
    evidence_report_required: true
    reconciliation_required: true
    config_version_change_required: true
    note: Validator never promotes candidates automatically. It may emit a recommendation. Promotion requires reviewed
      configuration change; the active YAML is never modified by the validator.
canonical_roles:
  vocabulary:
  - arrival_date
  - business_date
  - charge_amount
  - charge_code
  - charge_description
  - departure_date
  - external_reference
  - property_code
  - quantity
  - reason_code
  - reservation_reference
  required_for_safe_resolution:
  - business_date
  - property_code
  - charge_code
  assignments_shared_across_layouts:
    business_date: C12
    charge_code: C42
    charge_description: C45
    property_code: C51
    external_reference: C93
    quantity: C102
    reason_code: C108
  unassigned_blocking_activation:
  - charge_amount
  note: 'Canonical role assignments are only those with classification: canonical. Candidate roles are tracked for
    corpus evidence and must not activate canonical mapping until promoted. charge_amount remains unassigned; C48
    is the leading candidate. Unassigned roles do not block XML ingestion or Bronze capture.'
  presence_policy: presence:required applies only to fields whose removal prevents identity resolution, canonical-role
    resolution, privacy enforcement, or downstream processing. presence:expected applies to known fields that normally
    appear but are not required by the business process. Missing expected fields alter the structural signature
    and yield PASS_WITH_STRUCTURE_CHANGE when required roles remain resolvable; they must not quarantine every row.
  required_for_unknown_structure:
  - business_date
  - property_code
  - charge_code
  candidates:
    charge_amount: C48
    net_or_pre_tax_amount: C33
    reservation_reference: C9
    arrival_date: C15
    departure_date: C18
identity:
  roles:
  - property_code
  - business_date
  filename_token_patterns:
    property_code: ^[A-Z]{5}$
    business_date: ^[0-9]{2}-(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)-[0-9]{2}$
  note: Filename identity patterns are configuration constants for this source. The engine applies whatever patterns
    are declared here; it does not embed source-specific catalogues.
