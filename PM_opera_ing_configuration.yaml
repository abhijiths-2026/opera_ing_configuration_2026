known_residual_risk:
  id: ORDINAL_SHIFT_ROLE_DRIFT
  description: Oracle Reports names data-model columns by ordinal position in the report SELECT. A column inserted
    mid-SELECT shifts every subsequent C-number. The change presents as additive (nodes added, none removed, all
    declared nodes still present) while a structural role silently points at a different column.
  detectable_by:
  - Datatype assertion failure where the new column has a different type
  - Format assertion failure
  - Structure-change report showing additional nodes
  not_detectable_by: Any automated check, where the displaced column has the same datatype and format. A decimal
    replaced by a different decimal will pass every validation in this configuration.
  mitigation: Structure-change reports must be actioned rather than filed. The ageing schedule exists for this reason.
  upstream_cure: Mandate aliased columns in the Opera report build standard (SELECT x AS AGENT_ID) so elements carry
    semantic names and ordinal position becomes irrelevant.
activation_gate_policy:
  summary: Unassigned canonical roles block only activation and canonical propagation of that role. XML ingestion,
    Bronze capture, structural validation, layout selection, and candidate evidence collection continue so the corpus
    can be processed.
  ingestion: always_allowed_when_structure_parseable
  bronze_capture: always_allowed_including_candidate_and_undeclared_fields
  canonical_propagation: only_assigned_canonical_roles
unknown_signature_policy:
  ingestion: allowed
  bronze_capture: allowed
  structural_validation: allowed
  candidate_evidence_collection: allowed
  canonical_business_propagation: blocked
  identity_propagation:
    allowed_roles:
    - property_code
    - business_date
    note: charge_code (C42) may still be used for validation and identity-resolution gating under
      required_for_unknown_structure, but C42 is not an allowed identity_propagation role and must not
      propagate when the structure signature is unknown.
  outcome: PASS_WITH_STRUCTURE_CHANGE
canonical_scope:
  approved_signatures_only: true
  unknown_signatures: blocked
